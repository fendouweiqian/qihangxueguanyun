[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "education-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.3",
  "pydantic==2.11.5",
  "pymysql==1.1.1",
  "redis==5.0.4",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "beautifulsoup4==4.12.3",
  "fonttools==4.60.1",
  "python-multipart==0.0.20",
  "openpyxl==3.1.5",
  "xlrd==2.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
