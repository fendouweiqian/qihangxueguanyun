services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${EDUCATION_DB_NAME:-education_assistant}
      MYSQL_USER: ${EDUCATION_DB_USER:-education}
      MYSQL_PASSWORD: ${EDUCATION_DB_PASSWORD:?set EDUCATION_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - education_mysql:/var/lib/mysql
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build:
      context: ../backend
    environment:
      EDUCATION_DB_HOST: mysql
      EDUCATION_DB_PORT: 3306
      EDUCATION_DB_NAME: ${EDUCATION_DB_NAME:-education_assistant}
      EDUCATION_DB_USER: ${EDUCATION_DB_USER:-education}
      EDUCATION_DB_PASSWORD: ${EDUCATION_DB_PASSWORD:?set EDUCATION_DB_PASSWORD}
      EDUCATION_REDIS_URL: redis://redis:6379/1
      EDUCATION_REDIS_PASSWORD: ${EDUCATION_REDIS_PASSWORD:-}
    ports:
      - "8281:8281"
    depends_on:
      - mysql
      - redis
  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  education_mysql:
